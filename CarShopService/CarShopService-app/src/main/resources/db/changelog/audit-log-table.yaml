databaseChangeLog:
  - changeSet:
      id: "2024-01"
      author: "your_name"
      changes:
        - createTable:
            tableName: "audit_log"
            columns:
              - column:
                  name: "id"
                  type: "bigint"
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "timestamp"
                  type: "timestamp"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
              - column:
                  name: "action_type"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "username"
                  type: "varchar(255)"
                  constraints:
                    nullable: false
              - column:
                  name: "details"
                  type: "varchar(255)"
                  constraints:
                    nullable: true