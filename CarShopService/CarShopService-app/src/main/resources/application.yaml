server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/mydatabase
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml


  spring-doc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
    packages-to-scan:
      - org.example.controller
