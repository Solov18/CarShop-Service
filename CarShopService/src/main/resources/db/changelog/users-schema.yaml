                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "client_specific_field"
                  type: "varchar(255)"
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: "clients"
            baseColumnNames: "user_id"
            constraintName: "fk_clients_users"
            referencedTableName: "users"
            referencedColumnNames: "id"

  - changeSet:
      id: "4"
      author: "your_name"
      changes:
        - createSequence:
            sequenceName: "manager_id_seq"
            startValue: 1
            incrementBy: 1

        - createTable:
